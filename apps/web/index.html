<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#F4EFE9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1C1815" media="(prefers-color-scheme: dark)" />
		<!-- Apply the saved or system theme before first paint, so nothing flashes. Mirrors libs/theme.ts. -->
		<script>
			(() => {
				try {
					const match = document.cookie.match(/(?:^|; )theme=([^;]*)/);
					const theme = match ? decodeURIComponent(match[1]) : "system";
					const dark =
						theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.classList.toggle("dark", dark);
				} catch {
					// Without cookies or matchMedia the page starts light, and the app corrects it once it loads.
				}
			})();
		</script>
		<!-- The CSP has no 'unsafe-eval', so zod can't compile its parsers. Turning that off before any module loads also
		     skips zod's `new Function` probe, which the browser reports as a CSP violation even though zod catches it. -->
		<script>
			globalThis.__zod_globalConfig = { jitless: true };
		</script>
		<meta name="application-name" content="Reactive Resume" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Reactive Resume" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<!-- Keep the homepage description between 120 and 160 characters. -->
		<meta
			name="description"
			content="Free, open-source resume builder. Create, update, and share your resume, with PDF and Word downloads, no ads and no paywall."
		/>

		<link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48 64x64" />
		<link rel="icon" href="/pwa-192x192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" type="image/png" sizes="180x180 any" />
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

		<title>Free resume builder with PDF &amp; Word downloads | Reactive Resume</title>
	</head>
	<body>
		<!-- Empty here; the server prerenders the homepage into it (apps/server/src/static/web.ts). -->
		<div id="app"></div>
		<!-- Branded first paint; hidden once React populates #app (higher-specificity rule below). -->
		<div id="initial-loader">
			<img src="/icon/mark.png" width="48" height="48" alt="Countdown Creative" />
			<div class="initial-loader__spinner"></div>
			<span class="initial-loader__sr-only">Loading</span>
		</div>
		<style>
			@keyframes app-spin {
				to {
					transform: rotate(360deg);
				}
			}
			#initial-loader {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 24px;
				background: #f4efe9;
			}
			html.dark #initial-loader {
				background: #1c1815;
			}
			#app:not(:empty) ~ #initial-loader {
				display: none;
			}
			.initial-loader__spinner {
				width: 24px;
				height: 24px;
				border: 2px solid rgba(28, 27, 21, 0.2);
				border-top-color: #1e1a17;
				border-radius: 9999px;
				animation: app-spin 0.7s linear infinite;
			}
			html.dark .initial-loader__spinner {
				border-color: rgba(239, 238, 235, 0.2);
				border-top-color: #f6f1ec;
			}
			.initial-loader__sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip: rect(0 0 0 0);
			}
		</style>
		<script type="module" data-cfasync="false" src="/src/main.tsx"></script>
	</body>
</html>
